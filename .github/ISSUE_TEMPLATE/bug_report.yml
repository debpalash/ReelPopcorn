name: Bug report
description: Report a reproducible problem with ReelPopcorn.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and steps to reproduce. Remove credentials and personal data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, Apple Silicon or Intel, nsh --version
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Title or source
      description: Public provider URL, IMDb ID, or TMDB movie/episode identity, if relevant.
